# Validate the SwiftUI source stub. This repository does not yet contain an
# Xcode project or Swift package, so a package build/test command is not valid.

name: Swift source validation

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate:

    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4
    - name: Parse Swift sources
      run: swiftc -frontend -parse ios/PianomanuelHub/ContentView.swift ios/PianomanuelHub/PianomanuelHubApp.swift
